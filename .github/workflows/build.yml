name: Build Fixed AAB (Not TWA)
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
      - name: Build AAB
        run: |
          cp signing.keystore app/signing.keystore || true
          STORE_PASS=$(grep "Key store password" signing-key-info.txt | awk -F': ' '{print $2}' | tr -d '\r' | xargs)
          KEY_ALIAS=$(grep "Key alias" signing-key-info.txt | awk -F': ' '{print $2}' | tr -d '\r' | xargs)
          KEY_PASS=$(grep "Key password" signing-key-info.txt | awk -F': ' '{print $2}' | tr -d '\r' | xargs)
          echo "Using alias $KEY_ALIAS"
          gradle bundleRelease -PstoreFile=signing.keystore -PstorePassword=$STORE_PASS -PkeyAlias=$KEY_ALIAS -PkeyPassword=$KEY_PASS --stacktrace --no-daemon
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Rafiant-IQ-Fixed-AAB-Not-TWA
          path: app/build/outputs/bundle/release/*.aab
